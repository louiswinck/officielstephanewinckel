<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Stéphane Winckel — Chargé d'affaire DIRICKX Luxembourg." />
  <title>DIRICKX Luxembourg – Stéphane Winckel</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="//code.tidio.co/mni8r03mp2mzr2tbuxz5csmxfimyp4zd.js" async></script>

  <style>
    :root {
      --dirickx-green: #1f5e2c;
      --luxmeca-red: #c4161c;
      --text-light: #e5e7eb;
      --text-muted: #9ca3af;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-light);
      background: 
        linear-gradient(
          rgba(0,0,0,0.75),
          rgba(0,0,0,0.85)
        ),
        url("./luxmeca-bg.jpg") center / cover no-repeat fixed;
      scroll-behavior: smooth;
    }

    header {
      background-color: rgba(0,0,0,0.9);
      border-bottom: 2px solid var(--luxmeca-red);
    }

    section {
      background-color: rgba(15,15,15,0.92);
      padding: 3.5rem 2.5rem;
    }

    footer {
      background-color: rgba(0,0,0,0.95);
      color: var(--text-muted);
    }

    .fade-in { opacity: 0; transform: translateY(20px); animation: fadeIn 0.8s ease-out forwards; }
    .fade-in.visible { opacity: 1; transform: translateY(0); }
    @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

    .dirickx { color: var(--dirickx-green); }
    .luxmeca { color: var(--luxmeca-red); }

    .btn {
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .btn-dirickx {
      background-color: var(--dirickx-green);
      color: #fff;
    }

    .btn-dirickx:hover {
      background-color: #16401a;
    }

    .btn-outline-dirickx {
      border: 2px solid var(--dirickx-green);
      color: var(--dirickx-green);
    }

    .btn-outline-dirickx:hover {
      background-color: var(--dirickx-green);
      color: #fff;
    }

    .catalogue-container {
      position: relative;
      overflow: hidden;
    }

    .catalogue-container img {
      transition: transform 0.7s ease;
    }

    .catalogue-container:hover img {
      transform: scale(1.05);
    }

    .catalogue-overlay {
      position: absolute;
      bottom: 0;
      width: 100%;
      padding: 1.5rem 2rem;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      font-weight: 600;
      color: var(--dirickx-green);
    }

    input, textarea {
      background-color: #0b0b0b;
      border: 1px solid #333;
      color: #fff;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--luxmeca-red);
    }
  </style>
</head>

<body>

<header class="sticky top-0 z-50 w-full">
  <div class="px-6 py-6 flex justify-between items-center">
    <div class="flex gap-4 items-center">
      <img src="./logo-dirickx.png" class="h-12" />
      <div>
        <p class="dirickx font-semibold">Stéphane Winckel</p>
        <p class="text-sm text-gray-400">Chargé d'affaires · DIRICKX Luxembourg</p>
      </div>
    </div>

    <a class="btn btn-dirickx px-4 py-2"
       href="https://mail.google.com/mail/?view=cm&fs=1&to=stephane.winckel@luxmeca.lu">
      Envoyer un mail
    </a>
  </div>
</header>

<main class="px-6 py-16 space-y-20">

  <!-- Le reste de TON HTML est STRICTEMENT inchangé -->
  <!-- Sections, contact, map, footer : identiques -->

</main>

<script>
const elements = document.querySelectorAll('.fade-in');
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) entry.target.classList.add('visible');
  });
});
elements.forEach(el => observer.observe(el));
</script>

</body>
</html>
